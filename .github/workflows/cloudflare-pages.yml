name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare static site
        run: |
          mkdir -p dist/assets
          cp index.html styles.css signals.js _headers dist/
          cp assets/*.svg assets/*.png dist/assets/
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets." >&2
            exit 1
          fi
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=mision-impocittble --branch=main
      - name: Verify public page
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location \
              --header 'Cache-Control: no-cache' \
              --output /tmp/mision-impocittble.html \
              "https://mision-impocittble.pages.dev/?deploy=${GITHUB_SHA}" \
              && grep -q '18 de noviembre de 2026' /tmp/mision-impocittble.html \
              && grep -q 'signals.js?v=cti-3' /tmp/mision-impocittble.html; then
              break
            fi
            sleep 5
          done
          grep -q 'Mision impoCITTble' /tmp/mision-impocittble.html
          grep -q '18 de noviembre de 2026' /tmp/mision-impocittble.html
          if grep -q '11 de noviembre de 2026' /tmp/mision-impocittble.html; then
            echo 'The previous event date was found on the published page.' >&2
            exit 1
          fi
          curl --fail --silent --show-error --location --output /tmp/mision-signals.js \
            'https://mision-impocittble.pages.dev/signals.js?v=cti-3'
          grep -q 'CTI{18N0V-S3N4L-4CT1V4}' /tmp/mision-signals.js
          if grep -Eq 'IMPOCITTBLE\{|CTI\{(ACCESO_DENEGADO|ESCUDO_404|CLAVE_INCORRECTA|11NOV_SENAL_ACTIVA|11N0V-S3N4L-4CT1V4|RUTA_SIN_SALIDA)\}' /tmp/mision-signals.js; then
            echo 'An outdated flag was found in the published script.' >&2
            exit 1
          fi
