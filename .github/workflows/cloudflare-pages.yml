name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare static site
        run: |
          mkdir -p dist/assets
          cp index.html styles.css signals.js _headers dist/
          cp assets/*.svg assets/*.png dist/assets/
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets." >&2
            exit 1
          fi
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=mision-impocittble --branch=main
      - name: Verify public page
        run: |
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 5 \
            --output /tmp/mision-impocittble.html https://mision-impocittble.pages.dev/
          grep -q 'Mision impoCITTble' /tmp/mision-impocittble.html
          grep -q 'signals.js?v=cti-1' /tmp/mision-impocittble.html
          curl --fail --silent --show-error --location --output /tmp/mision-signals.js \
            'https://mision-impocittble.pages.dev/signals.js?v=cti-1'
          grep -q 'CTI{11NOV_SENAL_ACTIVA}' /tmp/mision-signals.js
          if grep -q 'IMPOCITTBLE{' /tmp/mision-signals.js; then
            echo 'Outdated flag format was found in the published script.' >&2
            exit 1
          fi
